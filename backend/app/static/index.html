<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Hostel</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="intro">
        <p class="eyebrow">SMART HOSTEL</p>
        <h1>A calmer way to run your hostel.</h1>
        <p class="intro-copy">A first look at the workspace for keeping every stay, space, and maintenance detail in view.</p>
      </section>
      <section class="auth-panel" aria-label="Account access">
        <div class="auth-heading"><span class="panel-mark">SH</span><div><p class="eyebrow">WELCOME</p><h2 id="form-title">Sign in</h2></div></div>
        <div class="tabs" role="tablist"><button class="tab active" data-mode="login" type="button">Login</button><button class="tab" data-mode="register" type="button">Register</button></div>
        <form id="auth-form">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" placeholder="At least 8 characters" required />
          <button class="submit" type="submit" id="submit-button">Continue <span>-></span></button>
          <p class="status" id="status" role="status"></p>
        </form>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
